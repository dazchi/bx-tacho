# Publishes web/ (the BX Tacho web app) to GitHub Pages, together with the
# firmware of the latest release (web/firmware/latest/, for the web app's
# "Use the latest release"), the firmware of every release since 2.0.0
# (web/firmware/releases/, for "Or another release") and the user manual
# (web/manual/, from docs/), on every push that changes either and whenever a
# release is published.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy web app

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'docs/manual-zh-TW.html'
      - 'docs/manual-screens/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # A release event runs on its tag, which the github-pages environment doesn't
  # accept, so it starts this workflow again on master instead
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Add the user manual
        run: |
          mkdir -p web/manual
          cp docs/manual-zh-TW.html web/manual/index.html
          cp -r docs/manual-screens web/manual/
      - name: Add the releases' firmware
        env:
          GH_TOKEN: ${{ github.token }}
        # web/firmware/latest/ (the newest) and web/firmware/releases/ (every
        # release since 2.0.0), each checked against its SHA256SUMS.txt
        run: python3 web/tools/fetch_releases.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
